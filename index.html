<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PMI Fleet - PMI Upstate SC</title>
  <meta name="description" content="Reserve the PMI Upstate SC company car, log trips, and track maintenance and insurance.">
  <meta name="theme-color" content="#101114">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PMI Fleet">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <style>
    :root { --bg: #101114; --orange: #ff6d00; --muted: #b9b9c0; }
    html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
    body { font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--muted); }
    .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; text-align: center; }
    .boot img { height: 48px; width: auto; }
    .spin { width: 26px; height: 26px; border: 3px solid #2a2b31; border-top-color: var(--orange); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .slow { visibility: hidden; font-size: 13px; }
    .slow.show { visibility: visible; }
    a { color: var(--orange); font-weight: 700; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: transparent; opacity: 0; transition: opacity .25s; }
    iframe.ready { opacity: 1; }
  </style>
</head>
<body>
  <div class="boot" aria-live="polite">
    <img src="logo.png" alt="PMI Upstate SC">
    <div class="spin" aria-hidden="true"></div>
    <div>Loading PMI Fleet...</div>
    <div class="slow" id="slow">Taking a while? <a id="direct" href="#" target="_blank" rel="noopener">Open the app directly</a></div>
  </div>
  <iframe id="app" title="PMI Fleet" allow="clipboard-write"></iframe>
  <noscript><p style="position:fixed;bottom:20px;width:100%;text-align:center">PMI Fleet needs JavaScript. <a href="https://script.google.com/macros/s/AKfycbySsN6LLKrvCzm-Jji68f5iUSB5PSZ0fsiP4i2LkVqVIwmlCPX9aBOSP7ah6G9pgX20/exec">Open the app directly</a>.</p></noscript>
  <script>
    (function () {
      // The app itself is a Google Apps Script web app. This page gives it the auto.pmiupstatesc.com address.
      var APP_URL = 'https://script.google.com/macros/s/AKfycbySsN6LLKrvCzm-Jji68f5iUSB5PSZ0fsiP4i2LkVqVIwmlCPX9aBOSP7ah6G9pgX20/exec';
      var frame = document.getElementById('app');
      document.getElementById('direct').href = APP_URL;
      frame.addEventListener('load', function () { setTimeout(function () { frame.classList.add('ready'); }, 300); });
      setTimeout(function () { document.getElementById('slow').classList.add('show'); }, 9000);
      frame.src = APP_URL;
    })();
  </script>
</body>
</html>
