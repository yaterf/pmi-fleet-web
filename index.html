<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PMI Fleet - PMI Upstate SC</title>
  <meta name="description" content="Reserve the PMI Upstate SC company car and see when it is free.">
  <meta name="theme-color" content="#101114">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PMI Fleet">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <style>
    :root { --bg: #101114; --orange: #ff6d00; --muted: #b9b9c0; }
    html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
    body { font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--muted); }
    .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; text-align: center; }
    .boot img { height: 48px; width: auto; }
    .spin { width: 26px; height: 26px; border: 3px solid #2a2b31; border-top-color: var(--orange); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .slow { visibility: hidden; font-size: 13px; }
    .slow.show { visibility: visible; }
    a { color: var(--orange); font-weight: 700; }
    /* The app fills the screen but stays clear of the iPhone notch and home bar. */
    iframe {
      position: fixed; border: 0; display: block; background: transparent; opacity: 0; transition: opacity .25s;
      top: env(safe-area-inset-top, 0px); left: env(safe-area-inset-left, 0px);
      width: calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
      height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    }
    iframe.ready { opacity: 1; }
    /* Install prompt */
    .install { position: fixed; z-index: 10; left: 12px; right: 12px; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); max-width: 460px; margin: 0 auto;
      display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 12px; border-radius: 14px; background: var(--bg); color: #fff;
      border: 1px solid #2a2b31; border-left: 4px solid var(--orange); box-shadow: 0 14px 34px -12px rgba(0,0,0,.7); font-size: 13.5px; }
    .install[hidden] { display: none; }
    .install img { width: 36px; height: 36px; border-radius: 9px; flex: none; }
    .install .txt { flex: 1; color: #d4d4d8; }
    .install .txt b { color: #fff; }
    .install button { font: inherit; cursor: pointer; }
    #install-go { background: var(--orange); color: #fff; border: 0; border-radius: 9px; padding: 8px 12px; font-weight: 700; }
    #install-x { background: transparent; color: var(--muted); border: 0; font-size: 22px; line-height: 1; padding: 2px 6px; }
    @media (min-width: 821px) { .install { left: auto; right: 20px; bottom: 20px; width: 420px; } }
  </style>
</head>
<body>
  <div class="boot" aria-live="polite">
    <img src="logo.png" alt="PMI Upstate SC">
    <div class="spin" aria-hidden="true"></div>
    <div>Loading PMI Fleet...</div>
    <div class="slow" id="slow">Taking a while? <a id="direct" href="#" target="_blank" rel="noopener">Open the app directly</a></div>
  </div>
  <iframe id="app" title="PMI Fleet" allow="clipboard-write"></iframe>
  <div class="install" id="install" role="dialog" aria-label="Install PMI Fleet" hidden>
    <img src="icon-192.png" alt="">
    <div class="txt" id="install-txt"></div>
    <button id="install-go" hidden>Install</button>
    <button id="install-x" aria-label="Not now">&times;</button>
  </div>
  <noscript><p style="position:fixed;bottom:20px;width:100%;text-align:center">PMI Fleet needs JavaScript. <a href="https://script.google.com/macros/s/AKfycbySsN6LLKrvCzm-Jji68f5iUSB5PSZ0fsiP4i2LkVqVIwmlCPX9aBOSP7ah6G9pgX20/exec">Open the app directly</a>.</p></noscript>
  <script>
    (function () {
      // The app itself is a Google Apps Script web app. This page gives it the auto.pmiupstatesc.com
      // address and makes it installable as a home-screen app.
      var APP_URL = 'https://script.google.com/macros/s/AKfycbySsN6LLKrvCzm-Jji68f5iUSB5PSZ0fsiP4i2LkVqVIwmlCPX9aBOSP7ah6G9pgX20/exec';
      var frame = document.getElementById('app');
      document.getElementById('direct').href = APP_URL;
      frame.addEventListener('load', function () { setTimeout(function () { frame.classList.add('ready'); }, 300); });
      setTimeout(function () { document.getElementById('slow').classList.add('show'); }, 9000);
      frame.src = APP_URL;

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
      }

      // Install prompt: Android and desktop Chrome/Edge offer a real Install button; iPhone gets instructions.
      var KEY = 'pmiFleetInstallDismissed';
      var box = document.getElementById('install'), txt = document.getElementById('install-txt');
      var go = document.getElementById('install-go'), x = document.getElementById('install-x');
      var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
      var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var deferred = null;
      function dismissedRecently() {
        try { var t = Number(localStorage.getItem(KEY)); return t && Date.now() - t < 14 * 86400000; } catch (e) { return false; }
      }
      function hide(remember) {
        box.hidden = true;
        if (remember) { try { localStorage.setItem(KEY, String(Date.now())); } catch (e) {} }
      }
      function show(html, canInstall) {
        if (standalone || dismissedRecently()) return;
        txt.innerHTML = html; go.hidden = !canInstall; box.hidden = false;
      }
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault(); deferred = e;
        show('Install <b>PMI Fleet</b> as an app on this ' + (/android/i.test(navigator.userAgent) ? 'phone' : 'device') + '.', true);
      });
      go.addEventListener('click', function () {
        if (!deferred) return hide(true);
        deferred.prompt();
        deferred.userChoice.then(function () { deferred = null; hide(true); });
      });
      x.addEventListener('click', function () { hide(true); });
      window.addEventListener('appinstalled', function () { hide(true); });
      if (ios && !standalone) {
        setTimeout(function () { show('Add <b>PMI Fleet</b> to your Home Screen: tap <b>Share</b>, then <b>Add to Home Screen</b>.', false); }, 4000);
      }
    })();
  </script>
</body>
</html>
